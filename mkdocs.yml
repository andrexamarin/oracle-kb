site_name: Oracle Knowledge Base
site_description: Base de conocimiento Oracle EBS, Forms, BI Publisher, SQL, PL/SQL y Linux
site_author: Andrés Ramírez

docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  custom_dir: overrides

  palette:

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - awesome-pages
  - macros
  - include-markdown
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - tables

  - footnotes

  - attr_list

  - pymdownx.emoji:
  
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.keys

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji

extra_css:
  - assets/css/custom.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/js/custom.js

repo_name: oracle-kb

repo_url: https://github.com/andrexamarin/oracle-kb

edit_uri: edit/main/docs/